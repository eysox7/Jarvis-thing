<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff5a3c">
  <meta name="description" content="Overheard: duyduğun sözü haritaya bırak. Yalnızca orada bulunanlar okur.">
  <title>Overheard</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon.svg">
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand" aria-label="overheard"><span class="brand-mark" aria-hidden="true">“</span>overheard</div>
    <nav id="cities" class="cities" data-i18n-label="profile.pilot"></nav>
  </header>

  <main id="map" class="map"></main>

  <div class="map-tools">
    <button id="btn-locate" class="tool-btn" type="button" data-i18n-label="map.locate">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
    </button>
    <button id="btn-explore" class="tool-btn" type="button" data-i18n-label="map.explore" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2.2 4.8-4.8 2.2 2.2-4.8 4.8-2.2Z"/></svg>
    </button>
  </div>

  <div id="demo-hint" class="demo-hint" role="note" hidden></div>

  <nav class="tabbar">
    <button type="button" data-nav="map">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z"/><path d="M9 4v14M15 6v14"/></svg>
      <span data-i18n="nav.map">Harita</span>
    </button>
    <button type="button" data-nav="places">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>
      <span data-i18n="nav.places">Mekânlar</span>
    </button>
    <button type="button" data-nav="post" class="fab">
      <span class="fab-mark" aria-hidden="true">“</span>
      <span data-i18n="nav.post">Duydum</span>
    </button>
    <button type="button" data-nav="inbox">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4V5Z"/></svg>
      <span data-i18n="nav.inbox">Mesajlar</span>
      <b class="badge" hidden></b>
    </button>
    <button type="button" data-nav="profile">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
      <span data-i18n="nav.profile">Profil</span>
    </button>
  </nav>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="sheet-backdrop" class="sheet-backdrop" hidden></div>
  <dialog id="sheet" class="sheet" aria-modal="false"></dialog>

  <script src="/vendor/leaflet/leaflet.js"></script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
